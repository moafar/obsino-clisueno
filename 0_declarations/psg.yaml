metadata:
  name: psg_shared_contract
  version: 1.0.0
  domain: psg

extract:
  entrada:
    ruta: "/mnt/e/RESULTADOS"
  procesamiento:
    tipos_validos: ["doc", "rtf"]
    glob_patron: "**/*"
    barra_progreso: true
  salida:
    carpeta_csv: "../staging"
  archivado:
    destino: "/mnt/e/RESULTADOS/RESULTADOS_OBSERVATORIO"
    rutas_clinicas_protegidas:
      - "/mnt/e/RESULTADOS"
      - "/mnt/e/RESULTADOS_OBSERVATORIO_REPROCESO"
  subflujos:
    salida_unificada:
      BASAL: "extract_psg_{timestamp}.csv"
    prefijos:
      BASAL: "bs"
  logging:
    level: "INFO"
    dir: "/home/rom/obsino/clisueno/logs"

transform:
  input:
    format: csv
    header: 0
    dtype: string
    keep_default_na: false
  steps:
    - op: psg_basal_transform
      params: {}
  output:
    format: xlsx
    sheet_name: procesado

load:
  project_id: observatorio-ino-1
  dataset_id: clisueno
  table_id: tbl_psg_prd
  write_disposition: WRITE_APPEND
  service_account_json: 3_load/secrets/obsino_clisueno_key.json
  source_sheet_name: procesado
  uuid_field: meta_uuid
  date_field: meta_fecha_estudio
  migrated_field: null

