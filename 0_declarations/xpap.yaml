metadata:
  name: xpap_shared_contract
  version: 1.0.0
  domain: xpap

extract:
  entrada:
    ruta: "../../staging"
  procesamiento:
    tipos_validos: ["docx", "doc", "rtf"]
    glob_patron: "**/*"
    barra_progreso: true
  salida:
    carpeta_csv: "../../staging"
  subflujos:
    salida_unificada:
      CPAP: "extract_xpap_{timestamp}.csv"
      BPAP: "extract_xpap_{timestamp}.csv"
    prefijos:
      CPAP: "xp"
      BPAP: "xp"
  logging:
    level: "INFO"
    dir: "/home/rom/obsino/clisueno/logs"

transform:
  input:
    format: csv
    header: 0
  steps:
    - op: xpap_transform
      params: {}
  output:
    format: xlsx
    sheet_name: procesado

load:
  project_id: observatorio-ino-1
  dataset_id: clisueno
  table_id: tbl_xpap_prd
  write_disposition: WRITE_APPEND
  service_account_json: 3_load/secrets/obsino_clisueno_key.json
  source_sheet_name: procesado
  uuid_field: xpap_uuid
  date_field: xpap_fecha_estudio
  migrated_field: xpap_migrado

schema:
  transform:
    input:
      columns:
        nombre: string
        edad_anos: float
        edad_meses: float
        edad_dias: float
        id: string
        peso: float
        medida_peso: string
        talla: float
        medida_talla: string
        imc: float
        cuello: float
        medida_cuello: string
        perimetro_abdominal: float
        medida_perimetro_abdominal: string
        solicita: string
        empresa: string
        fecha_estudio: datetime
        epworth: float
        tiempo_en_cama: float
        tiempo_sueno: float
        eficiencia_sueno: float
        latencia_sueno_total: float
        latencia_sueno_rem: float
        indice_microalertamientos: float
        porcentaje_sueno_rem: float
        porcentaje_sueno_profundo: float
        iac: float
        iao: float
        iam: float
        indice_desat_rem: float
        indice_desat_nrem: float
        indice_desat_total: float
        tiempo_desat_90_rem: float
        tiempo_desat_90_nrem: float
        tiempo_desat_80_rem: float
        tiempo_desat_80_nrem: float
        tiempo_desat_70_rem: float
        tiempo_desat_70_nrem: float
        numero_eventos_ah: float
        ih: float
        iah: float
        fuente: string
        uuid: string
        version_control: string
    output:
      columns: &transform_output_columns
        pte_nombre: string
        pte_id: string
        pte_imc: float
        pte_anos_decimales: float
        pte_grupo_edad: string
        pte_peso_kg: float
        pte_talla_cm: float
        pte_cuello_cm: float
        pte_perimetro_abdominal_cm: float
        xpap_solicita: string
        xpap_empresa: string
        xpap_fecha_estudio: datetime
        xpap_epworth: float
        cat_epworth: string
        xpap_tiempo_en_cama: float
        xpap_tiempo_sueno: float
        xpap_eficiencia_sueno: float
        cat_efic_sueno: string
        xpap_latencia_sueno_total: float
        xpap_latencia_sueno_rem: float
        xpap_indice_microalertamientos: float
        cat_indice_microalertamientos: string
        xpap_porcentaje_sueno_rem: float
        cat_porc_sueno_rem: string
        xpap_porcentaje_sueno_profundo: float
        cat_porc_sueno_profundo: string
        xpap_iac: float
        xpap_iao: float
        xpap_iam: float
        xpap_ih: float
        xpap_iah: float
        cat_iah: string
        xpap_indice_desat_rem: float
        xpap_indice_desat_nrem: float
        xpap_indice_desat_total: float
        xpap_numero_eventos_ah: float
        xpap_t90: float
        xpap_t80: float
        xpap_t70: float
        xpap_marca_equipo: string
        xpap_tipo_mascara: string
        xpap_tamano_mascara: string
        xpap_presion_terapeutica: string
        xpap_fuente: string
        xpap_uuid: string
        xpap_version_control: string
  load:
    input:
      columns: *transform_output_columns
