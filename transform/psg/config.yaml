metadata:
  name: psg
  version: 0.2.0
  domain: psg

input:
  format: csv
  header: 0

schema:
  input:
    columns:
      nombre: string
      edad_anos: float
      edad_meses: float
      edad_dias: float
      id: string
      peso: float
      medida_peso: string
